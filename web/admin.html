<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de administración — Parking Shopping Paysandú</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header>
    <h1>Panel de administración</h1>
    <button type="button" id="salir" hidden>Cerrar sesión</button>
  </header>

  <main>
    <section id="login">
      <h2>Ingresar</h2>
      <form id="form-login">
        <label for="email">Correo</label>
        <input type="email" id="email" required autocomplete="username">

        <label for="password">Contraseña</label>
        <input type="password" id="password" required autocomplete="current-password">

        <button type="submit">Entrar</button>
      </form>
      <p class="error" id="error-login" hidden></p>
    </section>

    <section id="panel" hidden>
      <p id="aviso" role="status"></p>

      <!-- El alta va ANTES de la tabla porque crea lo que la tabla muestra. -->
      <section class="bloque">
        <h2>Pisos</h2>

        <form id="form-nivel">
          <label for="nivel-nombre">Nombre del piso</label>
          <input type="text" id="nivel-nombre" required maxlength="40"
                 placeholder="Subsuelo 3" autocomplete="off">

          <label for="nivel-cantidad">Cantidad de plazas</label>
          <input type="number" id="nivel-cantidad" required min="1" max="300" value="24">

          <label for="nivel-por-fila">Plazas por fila</label>
          <input type="number" id="nivel-por-fila" required min="1" max="20" value="8">

          <!-- Como va a quedar repartido, antes de crearlo. Un piso creado con
               el numero equivocado no se puede editar: solo borrar y rehacer. -->
          <p id="nivel-vista" class="vista-previa" role="status"></p>

          <button type="submit">Crear piso</button>
        </form>

        <ul id="lista-pisos" class="lista-pisos"></ul>
      </section>

            <!-- La bandeja va primera: es lo unico del panel que pide una accion de
           una persona. El README (§9.4) es explicito en que el sistema no
           sanciona solo, y una alerta enterrada abajo de la tabla de plazas es
           una alerta que nadie mira. -->
      <section class="bloque">
        <h2>Alertas de plazas reservadas</h2>
        <p id="alertas-vacio" class="vista-previa">Sin alertas pendientes.</p>
        <ul id="lista-alertas" class="lista-pisos"></ul>
      </section>

      <section class="bloque">
        <h2>Plazas</h2>
        <table id="tabla-plazas">
          <thead>
            <tr>
              <th>Nivel</th><th>Plaza</th><th>Tipo</th>
              <th>Autorización</th><th>Estado</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </section>
  </main>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
