<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de administración — ParkEx</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header>
    <h1>Panel de administración</h1>
    <button type="button" id="salir" hidden>Cerrar sesión</button>
  </header>

  <main>
    <section id="login">
      <h2>Ingresar</h2>
      <form id="form-login">
        <label for="email">Correo</label>
        <input type="email" id="email" required autocomplete="username">

        <label for="password">Contraseña</label>
        <input type="password" id="password" required autocomplete="current-password">

        <button type="submit">Entrar</button>
      </form>
      <p class="error" id="error-login" hidden></p>
    </section>

    <section id="panel" hidden>
      <p id="aviso" role="status"></p>
      <table id="tabla-plazas">
        <thead>
          <tr>
            <th>Nivel</th><th>Plaza</th><th>Tipo</th>
            <th>Autorización</th><th>Estado</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
